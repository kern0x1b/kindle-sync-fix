[port]
name = "kindlesyncfix"
version = "1.0.2"
description = "Drops the empty Expect header old CFNetwork attaches to the Kindle app's Whispersync requests"

[platform]
use = "apple-ios"
arch = "armv7"
os-version = "6.0"
distribution = "jailbreak"

[tools]
ldid = "2.1.5-procursus7+23.gaf86971@charon/stable"

[variants.armv7]

[[device-library]]
name = "kindlesyncfix"
sources = ["kindlesyncfix.m"]
install = "/Library/MobileSubstrate/DynamicLibraries"
installs-into = "stage"
frameworks = ["Foundation"]
options = ["-O2"]
resources = ["packaging/kindlesyncfix.plist"]

[package]
control = "packaging/control"

[pipeline]
armv7 = ["build:device-library", "check:imports"]
