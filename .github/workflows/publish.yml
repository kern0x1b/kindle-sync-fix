name: Publish to Cydia repo

on:
  push:
    branches: [main]
    paths:
      - "dist/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout cydia aggregator repo
        uses: actions/checkout@v4
        with:
          repository: kern0x1b/cydia
          token: ${{ secrets.CYDIA_PUSH_TOKEN }}
          path: cydia

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Copy built debs into aggregator repo
        run: |
          mkdir -p cydia/debs
          cp dist/*.deb cydia/debs/

      - name: Regenerate Packages index
        run: |
          cd cydia
          dpkg-scanpackages debs /dev/null > Packages
          gzip -k -f Packages

      - name: Commit and push
        run: |
          cd cydia
          git config user.name "kindle-sync-fix CI"
          git config user.email "actions@github.com"
          git add debs Packages Packages.gz
          if git diff --cached --quiet; then
            echo "Nothing changed in cydia repo, skipping commit."
            exit 0
          fi
          git commit -m "Publish kindle-sync-fix update from ${{ github.repository }}@${{ github.sha }}"
          git push
